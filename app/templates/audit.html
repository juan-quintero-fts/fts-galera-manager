{% extends 'base.html' %}{% block content %}<h1>Auditoría</h1><table><thead><tr><th>Fecha</th><th>Actor</th><th>Nodo</th><th>Acción</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.ts }}</td><td>{{ r.actor }}</td><td>{{ r.host }}</td><td>{{ r.action }}</td><td>{{ 'OK' if r.ok else 'ERROR' }}</td><td><pre>{{ r.detail }}</pre></td></tr>{% else %}<tr><td colspan="6">Sin acciones registradas.</td></tr>{% endfor %}</tbody></table>{% endblock %}
